<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Flash Drafts</title>
<meta name="robots" content="noindex">
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --ink: #eef0f3; --muted: #9aa3b2;
    --accent: #5eb1ff; --good: #5edc8f; --warn: #ffce5e; --bad: #ff6b6b;
    --line: #2a2f3a; --code: #10131a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: 32px 24px 80px;
  }
  .wrap { max-width: 760px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 13px; margin: 0 0 24px; }
  .banner {
    background: #2a1f10; border: 1px solid #5a4520; color: var(--warn);
    border-radius: 8px; padding: 10px 14px; font-size: 12.5px; margin-bottom: 24px;
  }
  button {
    background: var(--accent); color: #0a0d12; border: none; border-radius: 8px;
    padding: 10px 20px; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  button:disabled { opacity: .5; cursor: default; }
  #log {
    background: var(--code); border: 1px solid var(--line); border-radius: 8px;
    padding: 12px 14px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12px; line-height: 1.6; color: var(--muted); margin-top: 20px;
    max-height: 260px; overflow-y: auto; white-space: pre-wrap; display: none;
  }
  #log.visible { display: block; }
  #log .err { color: var(--bad); }
  #results { margin-top: 24px; }
  .item {
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 16px 18px; margin-bottom: 14px;
  }
  .item-top { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .pill {
    font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em;
    color: var(--accent); background: rgba(94,177,255,.12); border-radius: 12px;
    padding: 3px 9px; font-family: ui-monospace, monospace;
  }
  .ts { font-size: 11px; color: var(--muted); margin-left: auto; }
  .item h3 { margin: 0 0 8px; font-size: 16px; }
  .item p { margin: 0 0 8px; font-size: 13.5px; line-height: 1.55; color: var(--ink); }
  .why { font-size: 12.5px; color: var(--muted); border-left: 2px solid var(--accent); padding-left: 10px; margin: 8px 0; }
  .meta { font-size: 11px; color: var(--muted); display: flex; justify-content: space-between; margin-top: 10px; }
  .meta a { color: var(--muted); text-decoration: underline; }
  img.hero { width: 100%; max-height: 160px; object-fit: cover; border-radius: 6px; margin-bottom: 10px; display: block; }
  .no-image { font-size: 11px; color: var(--bad); margin-bottom: 8px; }
  .raw-toggle { margin-top: 28px; }
  .raw-toggle summary { cursor: pointer; color: var(--muted); font-size: 12px; }
  pre#raw-json {
    background: var(--code); border: 1px solid var(--line); border-radius: 8px;
    padding: 12px; font-size: 11px; overflow-x: auto; color: var(--muted); margin-top: 10px;
  }
  .counts { font-size: 11px; color: var(--muted); margin-left: 8px; font-family: ui-monospace, monospace; }
  .counts.off { color: var(--warn); }
  input[type=date] { background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; font-size: 14px; margin-right: 8px; }
  .rej { font-size: 12px; color: var(--muted); margin: 4px 0; }
  .rej b { color: var(--ink); font-weight: 500; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Flash Drafts</h1>
  <p class="sub">Daily automated Flash runs saved as drafts (data/drafts/). Nothing here is live. Compare with your Gem before switching on auto-publish.</p>

  <input type="date" id="date" />
  <button id="run-btn">Load draft</button>
  <span id="status" style="margin-left: 12px; font-size: 13px; color: var(--muted);"></span>

  <div id="results"></div>
  <div id="rejected"></div>
  <div id="log"></div>

  <details class="raw-toggle" id="raw-details" style="display:none;">
    <summary>Raw JSON</summary>
    <pre id="raw-json"></pre>
  </details>
</div>

<script>
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
  const words = (s) => String(s || '').trim().split(/\s+/).filter(Boolean).length;
  // Today in India, the publishing day.
  $('date').value = new Date(Date.now() + 5.5 * 3600e3).toISOString().slice(0, 10);

  async function load() {
    const date = $('date').value;
    $('run-btn').disabled = true;
    $('status').textContent = 'Loading...';
    $('results').innerHTML = $('rejected').innerHTML = '';
    $('log').className = ''; $('raw-details').style.display = 'none';
    try {
      const res = await fetch(`/data/drafts/flash-${date}.json?t=${Date.now()}`);
      if (!res.ok) { $('status').textContent = `No draft for ${date} yet.`; return; }
      const items = await res.json();
      const report = await fetch(`/data/drafts/flash-${date}.report.json?t=${Date.now()}`).then(r => r.ok ? r.json() : null).catch(() => null);
      const withPhoto = items.filter(i => i.image).length;
      $('status').textContent = `${items.length} stories · ${withPhoto} with photos${report ? ` · generated ${new Date(report.generatedAt).toLocaleString()}` : ''}`;

      $('results').innerHTML = items.map(item => {
        const sw = words(item.summary), ww = words(item.why_it_matters);
        return `
        <div class="item">
          ${item.image
            ? `<img class="hero" src="${esc(item.image)}" alt="" referrerpolicy="no-referrer" onerror="this.outerHTML='<div class=no-image>⚠ photo failed to load</div>'" />`
            : `<div class="no-image">no photo (card shows the category icon)</div>`}
          <div class="item-top">
            <span class="pill">${esc(item.cat)}</span>
            <span class="counts ${sw < 45 || sw > 50 ? 'off' : ''}">summary ${sw}w</span>
            <span class="counts">why ${ww}w</span>
            <span class="ts">${esc(item.ts)}</span>
          </div>
          <h3>${esc(item.headline)}</h3>
          <p>${esc(item.summary)}</p>
          <div class="why"><strong>Why it matters:</strong> ${esc(item.why_it_matters)}</div>
          <div class="meta">
            <span>${esc(item.source)}${item.image_credit ? ` · ${esc(item.image_credit)}` : ''}</span>
            <a href="${esc(item.source_url)}" target="_blank" rel="noopener noreferrer">source &rarr;</a>
          </div>
        </div>`;
      }).join('');

      if (report) {
        if (report.shortfalls?.length) $('rejected').innerHTML += `<p class="rej"><b>Below category minimum:</b> ${esc(report.shortfalls.join(', '))}</p>`;
        if (report.rejected?.length) $('rejected').innerHTML += `<details class="raw-toggle"><summary>${report.rejected.length} stories rejected by the checks</summary>${report.rejected.map(r => `<p class="rej"><b>[${esc(r.cat)}] ${esc(r.headline)}</b><br>${esc(r.reasons.join('; '))}</p>`).join('')}</details>`;
        $('log').textContent = (report.log || []).join('\n');
        $('log').className = 'visible';
      }
      $('raw-json').textContent = JSON.stringify(items, null, 2);
      $('raw-details').style.display = 'block';
    } catch (e) {
      $('status').textContent = `Failed: ${e.message}`;
    } finally {
      $('run-btn').disabled = false;
    }
  }
  $('run-btn').addEventListener('click', load);
  load();
</script>
</body>
</html>
